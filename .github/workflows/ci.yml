# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck shfmt bats
    
    - name: ShellCheck
      run: shellcheck zabbix-auto-install.sh
    
    - name: shfmt
      run: shfmt -d -l -i 2 zabbix-auto-install.sh
    
    - name: Set up test helpers
      run: |
        mkdir -p test/test_helper
        for i in 1 2 3; do
          git clone --depth 1 https://github.com/bats-core/bats-support.git test/test_helper/bats-support && break
          sleep 2
        done
        for i in 1 2 3; do
          git clone --depth 1 https://github.com/bats-core/bats-assert.git test/test_helper/bats-assert && break
          sleep 2
        done
    
    - name: Bats tests
      run: bats test/
