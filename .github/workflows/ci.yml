# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck shfmt

    - name: ShellCheck
      run: shellcheck zabbix-auto-install.sh

    - name: shfmt
      run: shfmt -d -l -i 2 zabbix-auto-install.sh

  bats:
    name: Bats tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bats

    - name: Bats tests
      run: bats test/

  integration:
    name: Integration (${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: 22.04
            image: jrei/systemd-ubuntu:22.04
          - ubuntu: 24.04
            image: jrei/systemd-ubuntu:24.04
    steps:
    - uses: actions/checkout@v4

    - name: Clean install + rerun on Ubuntu ${{ matrix.ubuntu }}
      run: |
        container="zabbix-e2e-${{ matrix.ubuntu }}"
        docker run --privileged --cgroupns=host -d --name "$container" \
          -e DEBIAN_FRONTEND=noninteractive \
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
          -v "${PWD}:/work" \
          "${{ matrix.image }}" >/dev/null
        # Wait for systemd to be ready
        ready=0
        for i in $(seq 1 60); do
          if docker exec -e DEBIAN_FRONTEND=noninteractive "$container" systemctl is-system-running >/dev/null 2>&1 \
             || docker exec -e DEBIAN_FRONTEND=noninteractive "$container" systemctl is-active systemd-journald >/dev/null 2>&1; then
            ready=1; break
          fi
          sleep 2
        done
        [ "$ready" -eq 1 ] || { echo "::error::systemd not ready"; docker rm -f "$container"; exit 1; }
        # Disable apt timers before any apt command (lock killing is handled by the script when CI=true)
        docker exec -e DEBIAN_FRONTEND=noninteractive "$container" bash -c 'systemctl mask apt-daily.service apt-daily-upgrade.service 2>/dev/null; systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null; systemctl disable apt-daily.timer apt-daily-upgrade.timer 2>/dev/null; sleep 2'
        # Install required tools inside the container
        docker exec -e DEBIAN_FRONTEND=noninteractive "$container" bash -c 'apt-get update -qq && apt-get install -y -qq wget gnupg2 lsb-release >/dev/null'
        # Clean install (skip apache/firewall for speed; exercises install, schema, bcrypt)
        ERR_MSG=""
        if ! out=$(docker exec -e CI=true -e DEBIAN_FRONTEND=noninteractive "$container" bash /work/zabbix-auto-install.sh \
          --non-interactive --ip 127.0.0.1 --zabbix-ver 7.0 \
          --skip-apache --agent2 --no-firewall 2>&1); then
          LOG_TAIL=$(docker exec -e DEBIAN_FRONTEND=noninteractive "$container" bash -c 'tail -20 /var/log/zabbix-easydeploy.log 2>/dev/null' || true)
          ERR_LINE=$(echo "$out" | grep -iE 'error|fail|die' | tail -3)
          echo "### FAILED: clean install on Ubuntu ${{ matrix.ubuntu }}" >>"$GITHUB_STEP_SUMMARY"
          echo '```text' >>"$GITHUB_STEP_SUMMARY"
          echo "$out" | tail -40 >>"$GITHUB_STEP_SUMMARY"
          echo '---LOG---' >>"$GITHUB_STEP_SUMMARY"
          echo "$LOG_TAIL" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "::error::SCRIPT OUTPUT: $ERR_LINE"
          echo "::error::LOG TAIL: $LOG_TAIL"
          docker rm -f "$container" >/dev/null
          exit 1
        fi
        echo "$out" | tail -10
        # Post-install assertions: service active, DB reachable, HTTP endpoint up
        if ! docker exec -e DEBIAN_FRONTEND=noninteractive "$container" systemctl is-active zabbix-server >/dev/null; then
          echo "::error::zabbix-server not active on Ubuntu ${{ matrix.ubuntu }}"
          docker exec -e DEBIAN_FRONTEND=noninteractive "$container" systemctl status zabbix-server --no-pager || true
          docker rm -f "$container" >/dev/null
          exit 1
        fi
        if ! docker exec -e DEBIAN_FRONTEND=noninteractive "$container" mysqladmin ping -u root --silent >/dev/null 2>&1; then
          echo "::error::MariaDB not reachable (mysqladmin ping) on Ubuntu ${{ matrix.ubuntu }}"
          docker rm -f "$container" >/dev/null
          exit 1
        fi
        echo "::notice::Post-install assertions passed on Ubuntu ${{ matrix.ubuntu }} (zabbix-server active, MariaDB ping OK)"
        # Rerun: verify idempotency (services now active -> need --force)
        if ! out2=$(docker exec -e CI=true -e DEBIAN_FRONTEND=noninteractive "$container" bash /work/zabbix-auto-install.sh \
          --non-interactive --ip 127.0.0.1 --zabbix-ver 7.0 \
          --skip-apache --agent2 --no-firewall --force 2>&1); then
          LOG_TAIL2=$(docker exec -e DEBIAN_FRONTEND=noninteractive "$container" bash -c 'tail -20 /var/log/zabbix-easydeploy.log 2>/dev/null' || true)
          ERR_LINE2=$(echo "$out2" | grep -iE 'error|fail|die' | tail -3)
          echo "### FAILED: rerun on Ubuntu ${{ matrix.ubuntu }}" >>"$GITHUB_STEP_SUMMARY"
          echo '```text' >>"$GITHUB_STEP_SUMMARY"
          echo "$out2" | tail -40 >>"$GITHUB_STEP_SUMMARY"
          echo '---LOG---' >>"$GITHUB_STEP_SUMMARY"
          echo "$LOG_TAIL2" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "::error::SCRIPT OUTPUT: $ERR_LINE2"
          echo "::error::LOG TAIL: $LOG_TAIL2"
          docker rm -f "$container" >/dev/null
          exit 1
        fi
        echo "$out2" | tail -10
        echo "::notice::Integration passed on Ubuntu ${{ matrix.ubuntu }} (clean install + rerun)"
        docker rm -f "$container"
